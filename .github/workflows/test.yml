name: Tests

# Runs on every push and pull request: Lua syntax check + unit tests.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Lua syntax check
        run: |
          for f in *.lua tests/*.lua; do luac5.1 -p "$f"; done
          echo "All Lua files parse."

      - name: Unit tests
        run: lua5.1 tests/run.lua
